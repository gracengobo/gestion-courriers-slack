# Échange déclaré au démarrage depuis definitions.json
load_definitions = /etc/rabbitmq/definitions.json

# Développement uniquement : autorise le compte guest hors de la boucle locale.
# Sans cette ligne, les services lancés sur l'hôte ou dans un autre conteneur
# sont refusés (guest est limité à 127.0.0.1).
loopback_users.guest = false
